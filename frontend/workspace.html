<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Workspace</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="dashboard-layout">
    <aside class="sidebar">
      <h2>TaskFlow</h2>
      <p>Kanban Workspace</p>

      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="workspace.html" class="active">Workspace</a>
        <a href="task.html">My Tasks</a>
      </nav>

      <button id="logoutBtn" class="danger-btn">Logout</button>
    </aside>

    <section class="dashboard-main">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Project Board</p>
          <h1 id="boardTitle">Kanban Board</h1>
        </div>

        <div class="d-flex gap-2 align-items-center">
          <button id="openTaskFormBtn" class="primary-small-btn">+ Add Task</button>
          <div class="user-pill" id="userPill">Loading...</div>
        </div>
      </header>

      <section class="content-panel hidden" id="taskCreatePanel">
        <div class="section-heading">
          <h2>Create New Task</h2>
          <button id="closeTaskFormBtn" class="danger-btn" style="width:auto;">Close</button>
        </div>

        <form id="createTaskForm">
          <label class="form-label">Title</label>
          <input id="newTaskTitle" class="task-input" type="text" placeholder="Example: Build dashboard UI" required>

          <label class="form-label">Description</label>
          <textarea id="newTaskDescription" class="task-input" rows="4" placeholder="Task details..."></textarea>

          <div class="two-column-form">
            <div>
              <label class="form-label">Status</label>
              <select id="newTaskStatus" class="task-input">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="review">Review</option>
                <option value="done">Done</option>
              </select>
            </div>

            <div>
              <label class="form-label">Priority</label>
              <select id="newTaskPriority" class="task-input">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <button class="primary-small-btn" type="submit">Create Task</button>
        </form>
      </section>

      <section class="kanban-board">
        <div class="kanban-column" data-status="todo">
          <h2>To Do <span id="todoCount">0</span></h2>
          <div class="task-list" id="todoList"></div>
        </div>

        <div class="kanban-column" data-status="in_progress">
          <h2>In Progress <span id="progressCount">0</span></h2>
          <div class="task-list" id="progressList"></div>
        </div>

        <div class="kanban-column" data-status="review">
          <h2>Review <span id="reviewCount">0</span></h2>
          <div class="task-list" id="reviewList"></div>
        </div>

        <div class="kanban-column" data-status="done">
          <h2>Done <span id="doneCount">0</span></h2>
          <div class="task-list" id="doneList"></div>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast-message"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

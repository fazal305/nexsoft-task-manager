<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A full-stack task manager with JWT auth, workspaces, projects, Kanban tasks, comments, roles, MongoDB, Netlify, and Render." />
  <title>Nexsoft Task Manager | Login</title>
  <link rel="canonical" href="https://nexsoft-task-manager.netlify.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nexsoft-task-manager.netlify.app/" />
  <meta property="og:title" content="Nexsoft Task Manager | Login" />
  <meta property="og:description" content="A full-stack task manager with JWT auth, workspaces, projects, Kanban tasks, comments, roles, MongoDB, Netlify, and Render." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nexsoft Task Manager | Login" />
  <meta name="twitter:description" content="A full-stack task manager with JWT auth, workspaces, projects, Kanban tasks, comments, roles, MongoDB, Netlify, and Render." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand">
        <p class="eyebrow">Nexsoft Solutions Internship</p>
        <h1>TaskFlow</h1>
        <p>Full Stack Task Management System with teams, roles, projects, tasks, comments, and priorities.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Login</button>
        <button class="auth-tab" id="registerTab">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="owner@nexsoft.com" required>

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="123456" required>

        <button type="submit" class="primary-btn">Login</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <label>Name</label>
        <input type="text" id="registerName" placeholder="Fazal Abbas" required>

        <label>Email</label>
        <input type="email" id="registerEmail" placeholder="fazal@example.com" required>

        <label>Password</label>
        <input type="password" id="registerPassword" placeholder="Minimum 6 characters" required>

        <button type="submit" class="primary-btn">Create Account</button>
      </form>

      <p class="demo-text">
        Demo: owner@nexsoft.com / 123456
      </p>
    </section>
  </main>

  <div id="toast" class="toast-message"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
